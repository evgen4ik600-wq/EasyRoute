name: EasyRoute CI

on:
  push:
    paths:
      - 'install.sh'
      - 'easyroute-install.sh'
      - 'uninstall.sh'
      - 'files/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'easyroute-install.sh'
      - 'uninstall.sh'
      - 'files/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -eu
          dash -n install.sh
          dash -n easyroute-install.sh
          dash -n uninstall.sh
          dash -n files/usr/libexec/easyroute
          dash -n files/usr/libexec/easyroute-url-update
          dash -n files/usr/libexec/easyroute-dns
          dash -n files/usr/libexec/easyroute-catalog
          dash -n files/usr/libexec/easyroute-audit
          dash -n files/usr/libexec/rpcd/luci.easyroute
          dash -n files/etc/init.d/easyroute
          dash -n files/etc/hotplug.d/iface/95-easyroute

      - name: Shellcheck critical errors
        run: |
          shellcheck -S error -e SC1091             install.sh easyroute-install.sh uninstall.sh             files/usr/libexec/easyroute             files/usr/libexec/easyroute-url-update             files/usr/libexec/easyroute-dns             files/usr/libexec/easyroute-catalog             files/usr/libexec/rpcd/luci.easyroute             files/etc/init.d/easyroute             files/etc/hotplug.d/iface/95-easyroute

      - name: JSON syntax
        run: |
          python3 -m json.tool files/usr/share/luci/menu.d/luci-app-easyroute.json >/dev/null
          python3 -m json.tool files/usr/share/rpcd/acl.d/luci-app-easyroute.json >/dev/null

      - name: LuCI JavaScript syntax
        run: |
          node -e "new Function(require('fs').readFileSync('files/www/luci-static/resources/view/easyroute/routes-v1221.js','utf8'))"

      - name: Installer references
        run: |
          set -eu
          grep -Fq 'evgen4ik600-wq/EasyRoute' install.sh
          grep -Fq 'files/usr/libexec/easyroute' install.sh
          grep -Fq 'files/usr/libexec/easyroute-url-update' install.sh
          grep -Fq 'files/usr/libexec/easyroute-dns' install.sh
          grep -Fq 'files/usr/libexec/easyroute-catalog' install.sh
          grep -Fq 'files/usr/libexec/easyroute-audit' install.sh
          grep -Fq 'files/www/luci-static/resources/view/easyroute/routes-v1221.js' install.sh
          grep -Fq '"path": "easyroute/routes-v1221"' files/usr/share/luci/menu.d/luci-app-easyroute.json
          ! grep -Rq 'openwrt-simple-ui\|clientnames/' install.sh easyroute-install.sh files
          ! grep -Rq 'openwrt-easyroute-install.sh' install.sh easyroute-install.sh files

      - name: EasyRoute invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('files/usr/libexec/easyroute').read_text()
          updater = Path('files/usr/libexec/easyroute-url-update').read_text()
          dnsman = Path('files/usr/libexec/easyroute-dns').read_text()
          catalog = Path('files/usr/libexec/easyroute-catalog').read_text()
          audit = Path('files/usr/libexec/easyroute-audit').read_text()
          rpc = Path('files/usr/libexec/rpcd/luci.easyroute').read_text()
          ui = Path('files/www/luci-static/resources/view/easyroute/routes-v1221.js').read_text()
          hotplug = Path('files/etc/hotplug.d/iface/95-easyroute').read_text()
          installer = Path('install.sh').read_text()
          uninstaller = Path('uninstall.sh').read_text()
          checks = {
              "rule id enumerator": 'list_rule_ids()' in engine,
              "fw4 rollback": 'fw4 check' in engine and 'rollback_generated' in engine,
              "policy conflict detection": 'rule_slot_conflict()' in engine,
              "safe route deletion": 'fwmark "$MARK/0xff" lookup "$TABLE"' in engine,
              "device block fallback": 'ether saddr @$setm drop' in engine,
              "url success timestamp": '$id.success' in updater,
              "url attempt timestamp": '$id.attempt' in updater,
              "url rollback": 'previous list restored' in updater,
              "transactional rule edit": 'Изменения отменены' in rpc,
              "transactional rule delete": 'Удаление отменено' in rpc,
              "transactional device change": 'Изменение устройства отменено' in rpc,
              "transactional profile change": 'Изменения VPN-профиля отменены' in rpc,
              "real updater selftest": 'iplist.opencck.org' in rpc,
              "selftest verifies catalog helper": 'catalog_ok' in rpc and '/usr/libexec/easyroute-catalog catalog' in rpc,
              "specific routing selftest": '1066+n' in rpc and 'fwmark $m/0xff' in rpc,
              "health uses all_ok": 'health.all_ok' in ui,
              "dot manager uses stubby": '127.0.0.1#5453' in dnsman and 'GETDNS_TRANSPORT_TLS' in dnsman,
              "dot does not touch peerdns": 'peerdns' not in dnsman,
              "dot does not disable ipv6": 'network.wan6' not in dnsman and 'ula_prefix' not in dnsman,
              "dot rollback": 'rollback_enable' in dnsman and 'restore_dnsmasq' in dnsman,
              "dot refuses external stubby": 'Stubby уже установлен вне EasyRoute' in dnsman,
              "dot respects existing encrypted DNS": 'https-dns-proxy' in dnsman and 'external_dns_detected' in dnsman and 'dnsState.external' in ui,
              "dot rpc": 'dns_status()' in rpc and 'dns_apply()' in rpc,
              "dot ui": 'Защищённый DNS (DoT)' in ui,
              "catalog main endpoint": 'https://iplist.opencck.org/' in catalog,
              "catalog jshn nounset safe": 'set -u' not in [line.strip() for line in catalog.splitlines() if not line.lstrip().startswith('#')],
              "catalog beta endpoint": 'https://beta.iplist.opencck.org/' in catalog,
              "catalog metadata transient": '/tmp/easyroute-catalog.$' in catalog and '/etc/easyroute/catalog' not in catalog,
              "catalog chunking": 'CHUNK_SITES=30' in catalog,
              "catalog size limit": 'MAX_RESULT_BYTES=1048576' in catalog,
              "catalog updater": 'source_type' in updater and 'catalog)' in updater,
              "catalog CIDR opt-in": 'catalog_use_cidr4' in catalog and 'use_cidr4' in rpc and 'Добавлять IPv4 CIDR' in ui,
              "catalog rpc": 'catalog()' in rpc and 'save_catalog()' in rpc,
              "catalog ui": 'Каталог OpenCCK' in ui and 'callSaveCatalog' in ui,
              "catalog edit avoids payload": "if [ \"$source_type\" = 'catalog' ]" in rpc,
              "unique updater temp": 'easyroute-url.$id.$' in updater and 'easyroute-url.$id.$"' not in updater,
              "unique manual temp": '.$id.tmp.$' in rpc and '.$id.tmp.$"' not in rpc,
              "updater serialized": "easyroute-url-update.lock" in updater and "acquire_lock" in updater,
              "engine serialized": "easyroute-engine.lock" in engine and "acquire_lock" in engine,
              "success only after apply": "Updated and applied" in updater and "waiting for apply" in updater,
              "routing table ownership": "table_conflict()" in engine and "Конфликт IPv4 routing table" in engine,
              "IPv6 input sanitized": "^[0-9A-Fa-f:]+$" in engine and "b[2]+0<=128" in engine,
              "profile old routes cleanup": "старые маршруты профиля" in rpc and "маршруты удаляемого профиля" in rpc,
              "fwmark bounded": "fwmark должен быть в диапазоне 1..255" in rpc,
              "cache busted UI": "EasyRoute 1.2.21" in ui,
              "UI helpers restored": all(("function "+name+"(") in ui for name in ["notify","bytes","ago","closeBtn","profileSelect","refresh","manualEditor"]),
              "audit redacts AWG secrets": '<redacted>' in audit and 'private_key' in audit and 'preshared_key' in audit,
              "VPN status uses interface state": "handshake_age" in rpc and "интерфейс поднят · нет handshake" in ui,
              "installer unique temp": 'easyroute-install.$' in installer and 'easyroute-cron.$' in installer,
              "uninstaller unique temp": 'easyroute-cron.$' in uninstaller and 'dnsmasq.conf.easyroute.$' in uninstaller,
              "transactional payload upgrade": 'previous' in installer and 'предыдущая версия восстановлена' in installer,
              "version after apply": installer.find('printf \'%s\\n\' "$VERSION" > /etc/easyroute/version') > installer.find('/usr/libexec/easyroute apply'),
              "hotplug never adopts vpn": 'uci set "easyroute.main.interface=' not in hotplug,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{name}: {'OK' if ok else 'FAIL'}")
          if failed:
              raise SystemExit("Failed: " + ", ".join(failed))
          PY
