name: EasyRoute CI

on:
  push:
    paths:
      - 'install.sh'
      - 'easyroute-install.sh'
      - 'uninstall.sh'
      - 'files/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'easyroute-install.sh'
      - 'uninstall.sh'
      - 'files/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -eu
          dash -n install.sh
          dash -n easyroute-install.sh
          dash -n uninstall.sh
          dash -n files/usr/libexec/easyroute
          dash -n files/usr/libexec/easyroute-url-update
          dash -n files/usr/libexec/easyroute-dns
          dash -n files/usr/libexec/rpcd/luci.easyroute
          dash -n files/etc/init.d/easyroute
          dash -n files/etc/hotplug.d/iface/95-easyroute

      - name: JSON syntax
        run: |
          python3 -m json.tool files/usr/share/luci/menu.d/luci-app-easyroute.json >/dev/null
          python3 -m json.tool files/usr/share/rpcd/acl.d/luci-app-easyroute.json >/dev/null

      - name: LuCI JavaScript syntax
        run: |
          node -e "new Function(require('fs').readFileSync('files/www/luci-static/resources/view/easyroute/routes-v110.js','utf8'))"

      - name: Installer references
        run: |
          set -eu
          grep -Fq 'evgen4ik600-wq/EasyRoute' install.sh
          grep -Fq 'files/usr/libexec/easyroute' install.sh
          grep -Fq 'files/usr/libexec/easyroute-url-update' install.sh
          grep -Fq 'files/usr/libexec/easyroute-dns' install.sh
          grep -Fq 'files/www/luci-static/resources/view/easyroute/routes-v110.js' install.sh
          grep -Fq '"path": "easyroute/routes-v110"' files/usr/share/luci/menu.d/luci-app-easyroute.json
          ! grep -Rq 'openwrt-simple-ui\|clientnames/' install.sh easyroute-install.sh files
          ! grep -Rq 'openwrt-easyroute-install.sh' install.sh easyroute-install.sh files

      - name: EasyRoute invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('files/usr/libexec/easyroute').read_text()
          updater = Path('files/usr/libexec/easyroute-url-update').read_text()
          dnsman = Path('files/usr/libexec/easyroute-dns').read_text()
          rpc = Path('files/usr/libexec/rpcd/luci.easyroute').read_text()
          ui = Path('files/www/luci-static/resources/view/easyroute/routes-v110.js').read_text()
          hotplug = Path('files/etc/hotplug.d/iface/95-easyroute').read_text()
          checks = {
              "rule id enumerator": 'list_rule_ids()' in engine,
              "fw4 rollback": 'fw4 check' in engine and 'rollback_generated' in engine,
              "policy conflict detection": 'rule_slot_conflict()' in engine,
              "safe route deletion": 'fwmark "$MARK/0xff" lookup "$TABLE"' in engine,
              "device block fallback": 'ether saddr @$setm drop' in engine,
              "url success timestamp": '$id.success' in updater,
              "url attempt timestamp": '$id.attempt' in updater,
              "url rollback": 'previous list restored' in updater,
              "transactional rule edit": 'Изменения отменены' in rpc,
              "transactional rule delete": 'Удаление отменено' in rpc,
              "transactional device change": 'Изменение устройства отменено' in rpc,
              "transactional profile change": 'Изменения VPN-профиля отменены' in rpc,
              "real updater selftest": 'iplist.opencck.org' in rpc,
              "specific routing selftest": '1066+n' in rpc and 'fwmark $m/0xff' in rpc,
              "health uses all_ok": 'health.all_ok' in ui,
              "dot manager uses stubby": '127.0.0.1#5453' in dnsman and 'GETDNS_TRANSPORT_TLS' in dnsman,
              "dot does not touch peerdns": 'peerdns' not in dnsman,
              "dot does not disable ipv6": 'network.wan6' not in dnsman and 'ula_prefix' not in dnsman,
              "dot rollback": 'rollback_enable' in dnsman and 'restore_dnsmasq' in dnsman,
              "dot refuses external stubby": 'Stubby уже установлен вне EasyRoute' in dnsman,
              "dot rpc": 'dns_status()' in rpc and 'dns_apply()' in rpc,
              "dot ui": 'Защищённый DNS (DoT)' in ui,
              "hotplug never adopts vpn": 'uci set "easyroute.main.interface=' not in hotplug,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{name}: {'OK' if ok else 'FAIL'}")
          if failed:
              raise SystemExit("Failed: " + ", ".join(failed))
          PY
